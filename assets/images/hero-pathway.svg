  </g>
  <g transform="translate(247 337)" font-family="Arial, sans-serif" font-weight="700" letter-spacing="1.5"><rect width="74" height="28" rx="8" fill="#FFA500" stroke="#111111" stroke-width="3"/><text x="37" y="19" text-anchor="middle" font-size="12" fill="#111111">SKILLS</text></g>
