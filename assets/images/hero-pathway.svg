<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid slice">
  <title id="title">Studentico pathway</title>
  <desc id="desc">A roadmap from campus through practical skills and opportunities to a stronger future.</desc>
  <rect width="600" height="700" fill="#111111"/>
  <circle cx="490" cy="108" r="195" fill="#FFA500"/>
  <circle cx="490" cy="108" r="126" fill="#E38A00" opacity=".55"/>
