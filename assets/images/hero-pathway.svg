    <path d="m24 20 52-28 28 15-53 28z" fill="#FFA500" stroke="#111111" stroke-width="4"/>
    <path d="M69 84v27M91 72v27M111 61v27" stroke="#111111" stroke-width="5"/>
  </g>
  <g transform="translate(102 380)" font-family="Arial, sans-serif" font-weight="700" letter-spacing="1.3"><rect width="104" height="28" rx="8" fill="#FFF6E9" stroke="#111111" stroke-width="3"/><text x="52" y="19" text-anchor="middle" font-size="11" fill="#111111">UNIMED CAMPUS</text></g>
  <!-- Skills stop: isometric toolkit. -->
  <g transform="translate(250 381)">
