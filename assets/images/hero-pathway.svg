  <path d="M121 515 236 455 302 419 428 350 493 314" fill="none" stroke="#FFA500" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#FFF6E9"><circle cx="121" cy="515" r="5"/><circle cx="236" cy="455" r="5"/><circle cx="302" cy="419" r="5"/><circle cx="428" cy="350" r="5"/></g>
